name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — the action reads it from package.json's
      # `packageManager` field, and specifying both is a hard error.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

# The generated data under packages/core/src/data/ and the corpus under
# packages/fixtures/data/ are NOT regenerated here: their generators need the
# upstream Python tree and sxtwl, which are build inputs rather than
# dependencies. They are committed, and the parity suites are what proves they
# are still right. See scripts/gen-*.py for how to regenerate by hand.
